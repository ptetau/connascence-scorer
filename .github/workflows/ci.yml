name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: dotnet build Connascence.sln

      - name: Unit tests
        run: dotnet run --project tests/Connascence.Tests --no-build

      - name: Scenarios (detection, change prediction, gate)
        run: python3 tests/scenarios/run.py

      - name: End-to-end workflow
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec dotnet %s "$@"\n' "$PWD/src/Connascence.Cli/bin/Debug/net8.0/connascence.dll" > "$RUNNER_TEMP/bin/connascence"
          chmod +x "$RUNNER_TEMP/bin/connascence"
          PATH="$RUNNER_TEMP/bin:$PATH" sh tests/e2e.sh "$RUNNER_TEMP/e2e"

      - name: Coupling gate (the analyzer on its own code)
        if: github.event_name == 'pull_request'
        run: dotnet src/Connascence.Cli/bin/Debug/net8.0/connascence.dll check . --since "origin/${{ github.base_ref }}" --format markdown
